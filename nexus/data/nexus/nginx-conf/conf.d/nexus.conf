server {
  listen 8888 ssl;
  server_name repo-nexus.kavosh.org;

#  ssl_verify_client       on;
  ssl_certificate /etc/ssl/certs/ssl_kavosh.crt;
  ssl_certificate_key /etc/ssl/certs/kavosh2024_key.key;

  # allow large uploads of files
  # client_max_body_size 1G;
  #  ssl on;

  # optimize downloading files larger than 1G
  #proxy_max_temp_file_size 2G;

  location / {
     proxy_pass http://10.250.0.11:8081/;
     proxy_set_header Host $host;
     proxy_set_header X-Real-IP $remote_addr;
     proxy_set_header X-Forwarded-Host $host:$server_port;
     proxy_set_header X-Forwarded-Server $host;
     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
     proxy_set_header X-Forwarded-Proto "https";
  }
}

server {
  listen 443 ssl;
  server_name repo-nexus.kavosh.org;

##  ssl_certificate /etc/ssl/certs/kavosh.crt;
##  ssl_certificate_key /etc/ssl/certs/kavosh.key;
