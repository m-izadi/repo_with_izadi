#  ssl_certificate_key /etc/ssl/certs/ssl.key;		# before sell certificate

#  ssl_verify_client       on;
  ssl_certificate /etc/ssl/certs/ssl_kavosh.crt;
  ssl_certificate_key /etc/ssl/certs/kavosh2024_key.key;
#  ssl_trusted_certificate /etc/ssl/certs/ssl_kavosh.crt;

  location / {
     proxy_pass http://10.250.0.11:8080/;
     proxy_set_header Host $host;
     proxy_set_header X-Real-IP $remote_addr;
     proxy_set_header X-Forwarded-Host $host:$server_port;
     proxy_set_header X-Forwarded-Server $host;
     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
     proxy_set_header X-Forwarded-Proto "https";
  }
  location /push {
     proxy_pass http://10.250.0.11:8082/;
     proxy_set_header Host $host;
     proxy_set_header X-Real-IP $remote_addr;
     proxy_set_header X-Forwarded-Host $host:$server_port;
     proxy_set_header X-Forwarded-Server $host;
     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
     proxy_set_header X-Forwarded-Proto "https";
  }
}

